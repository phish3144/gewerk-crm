<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
  <style>
    body { margin: 0; font-family: Barlow, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FFC72C; text-decoration: none; }
    a:hover { color: #FFD866; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #17191B; color: #F4F6F7; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #212528; border-bottom: 1px solid #383D42;">
    <div style="width: 44px; height: 44px; border-radius: 10px; background: #2A2E32; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F6F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </div>
    <div style="flex-grow: 1; min-width: 0;">
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px; line-height: 1.1; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">KITA AHORNWEG</div>
      <div style="font-size: 13px; color: #98A1A8; line-height: 1.3;">Bauabschnitt 2 &middot; Elektro</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #3A2E10; border-bottom: 2px solid #FFC72C;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFC72C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M12 3v12"></path><path d="M8 11l4 4 4-4"></path><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"></path></svg>
    <div style="flex-grow: 1;">
      <div style="font-weight: 600; font-size: 15px; color: #FFC72C; line-height: 1.25;">Offline &ndash; 3 Eintr&auml;ge warten</div>
      <div style="font-size: 13px; color: #C9A94E; line-height: 1.3;">Wird gesendet, sobald Netz da ist</div>
    </div>
  </div>

  <div style="padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
    <div style="grid-column: span 2; background: #FFC72C; color: #17191B; border-radius: 14px; padding: 20px; display: flex; align-items: center; gap: 14px; min-height: 76px;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#17191B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M3 8a2 2 0 012-2h2.5l1.2-2h6.6l1.2 2H21a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path><circle cx="12" cy="12.5" r="3.6"></circle></svg>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.02em;">FOTO AUFNEHMEN</div>
    </div>

    <div style="background: #212528; border: 1px solid #383D42; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 88px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFC72C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v13l-4 4H4z"></path><path d="M8 9h8"></path><path d="M8 13h5"></path></svg>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px;">NOTIZ</div>
    </div>

    <div style="background: #212528; border: 1px solid #383D42; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 88px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFC72C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9h20v6H2z"></path><path d="M6 9v3"></path><path d="M10 9v4"></path><path d="M14 9v3"></path><path d="M18 9v4"></path></svg>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px;">AUFMASS</div>
    </div>
  </div>

  <div style="padding: 4px 16px 10px; display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 17px; color: #98A1A8; letter-spacing: 0.06em;">HEUTE ERFASST</div>
    <div style="font-size: 14px; color: #98A1A8;">Di, 24. Aug</div>
  </div>

  <div style="flex-grow: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">

    <div style="display: flex; align-items: center; gap: 12px; background: #212528; border: 1px solid #383D42; border-radius: 12px; padding: 12px;">
      <div style="width: 52px; height: 52px; border-radius: 9px; background: #3A3F44; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6F7A81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 012-2h2.5l1.2-2h6.6l1.2 2H21a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path><circle cx="12" cy="12.5" r="3.6"></circle></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-weight: 600; font-size: 15px; line-height: 1.3;">Verteilerschrank UG</div>
        <div style="font-size: 13px; color: #98A1A8;">14:22 &middot; M. Kellner</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: #3A2E10; border-radius: 999px; padding: 6px 10px; flex-shrink: 0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFC72C" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v6l4 2"></path><circle cx="12" cy="12" r="9"></circle></svg>
        <span style="font-size: 12px; font-weight: 600; color: #FFC72C;">Wartet</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #212528; border: 1px solid #383D42; border-radius: 12px; padding: 12px;">
      <div style="width: 52px; height: 52px; border-radius: 9px; background: #3A3F44; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6F7A81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9h20v6H2z"></path><path d="M6 9v3"></path><path d="M10 9v4"></path><path d="M14 9v3"></path></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-weight: 600; font-size: 15px; line-height: 1.3;">Aufma&szlig; Flur &middot; 12,40 m</div>
        <div style="font-size: 13px; color: #98A1A8;">13:05 &middot; M. Kellner</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: #14301F; border-radius: 999px; padding: 6px 10px; flex-shrink: 0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5FD08A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>
        <span style="font-size: 12px; font-weight: 600; color: #5FD08A;">Gesendet</span>
      </div>
    </div>

  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; background: #212528; border-top: 1px solid #383D42; padding: 8px 8px 12px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 10px; background: #2A2E32;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFC72C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v13l-4 4H4z"></path><path d="M8 9h8"></path></svg>
      <span style="font-size: 12px; font-weight: 600; color: #FFC72C;">Doku</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#98A1A8" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 6.5V12l4 2"></path></svg>
      <span style="font-size: 12px; color: #98A1A8;">Zeit</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#98A1A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h10"></path></svg>
      <span style="font-size: 12px; color: #98A1A8;">Auftr&auml;ge</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#98A1A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20a7 7 0 0114 0"></path></svg>
      <span style="font-size: 12px; color: #98A1A8;">Konto</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
