    <div style="display: flex; align-items: center; gap: 12px; border: 1px solid #DCE1E7; border-radius: 10px; padding: 12px;">
      <div style="width: 52px; height: 52px; border-radius: 7px; background: #EDF0F3; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA5B1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 012-2h2.5l1.2-2h6.6l1.2 2H21a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path><circle cx="12" cy="12.5" r="3.6"></circle></svg>

      <div style="flex-grow: 1; min-width: 0;">

    <div style="display: flex; align-items: center; gap: 12px; border: 1px solid #DCE1E7; border-radius: 10px; padding: 12px;">
      <div style="width: 52px; height: 52px; border-radius: 7px; background: #EDF0F3; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA5B1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9h20v6H2z"></path><path d="M6 9v3"></path><path d="M10 9v4"></path><path d="M14 9v3"></path></svg>

        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#067647" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"></path></svg>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; border-top: 1px solid #DCE1E7; padding: 8px 8px 12px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 8px; background: #E8EFFC;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#0B4FCC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v13l-4 4H4z"></path><path d="M8 9h8"></path></svg>
      <span style="font-size: 12px; font-weight: 600; color: #0B4FCC;">Doku</span>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#5B6672" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 6.5V12l4 2"></path></svg>
