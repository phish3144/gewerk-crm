<!doctype html>

<x-dc>

<div style="width: 390px; height: 844px; background: #17191B; color: #F4F6F7; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 20px 16px 16px;">
    <div style="background: #212528; border: 1px solid #383D42; border-radius: 16px; padding: 22px 20px;">

      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 62px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; margin: 6px 0 14px; color: #FFC72C;">04:33</div>

        <div style="min-width: 0;">

          <div style="font-size: 13px; color: #98A1A8;">Leerrohr verlegen &middot; Pos. 1.1</div>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 0 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
    <div style="background: #FF6B5E; color: #17191B; border-radius: 14px; padding: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 62px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17191B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>

    <div style="background: #212528; border: 1px solid #383D42; border-radius: 14px; padding: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 62px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFC72C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6v12"></path><path d="M16 6v12"></path></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.02em; color: #FFC72C;">PAUSE</span>
    </div>
  </div>

  <div style="padding: 18px 16px 10px; display: flex; align-items: baseline; justify-content: space-between;">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 17px; color: #98A1A8; letter-spacing: 0.06em;">HEUTE GEBUCHT</div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #F4F6F7;">4,55 h</div>
  </div>

  <div style="flex-grow: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">

    <div style="display: flex; align-items: center; gap: 12px; background: #212528; border: 1px solid #383D42; border-radius: 12px; padding: 13px 14px;">
      <div style="width: 6px; height: 34px; border-radius: 3px; background: #3987e5; flex-shrink: 0;"></div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-weight: 600; font-size: 15px; line-height: 1.3;">Kita Ahornweg</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #98A1A8;">07:12 &ndash; l&auml;uft</div>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #FFC72C; flex-shrink: 0;">4,55 h</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #212528; border: 1px solid #383D42; border-radius: 12px; padding: 13px 14px;">
      <div style="width: 6px; height: 34px; border-radius: 3px; background: #6F7A81; flex-shrink: 0;"></div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-weight: 600; font-size: 15px; line-height: 1.3;">Fahrzeit</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #98A1A8;">06:40 &ndash; 07:12</div>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; flex-shrink: 0;">0,53 h</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px dashed #383D42; border-radius: 12px; color: #98A1A8;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#98A1A8" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
      <span style="font-size: 15px;">Zeit nachtragen</span>
    </div>

  </div>

  <div style="margin: 14px 16px 0; background: #3A2E10; border-left: 3px solid #FFC72C; border-radius: 0 10px 10px 0; padding: 13px 15px; display: flex; align-items: center; gap: 12px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC72C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M12 9v5"></path><path d="M12 17.5v.01"></path><circle cx="12" cy="12" r="9"></circle></svg>
    <div style="flex-grow: 1;">
      <div style="font-size: 14px; font-weight: 600; color: #FFC72C; line-height: 1.3;">Woche: 31,2 h erfasst</div>
      <div style="font-size: 13px; color: #C9A94E;">8,8 h bis zur Sollzeit</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; background: #212528; border-top: 1px solid #383D42; padding: 8px 8px 12px; margin-top: 14px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#98A1A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v13l-4 4H4z"></path><path d="M8 9h8"></path></svg>
      <span style="font-size: 12px; color: #98A1A8;">Doku</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 10px; background: #2A2E32;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFC72C" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 6.5V12l4 2"></path></svg>
      <span style="font-size: 12px; font-weight: 600; color: #FFC72C;">Zeit</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#98A1A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h10"></path></svg>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#98A1A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20a7 7 0 0114 0"></path></svg>
      <span style="font-size: 12px; color: #98A1A8;">Konto</span>
    </div>
  </div>

</div>
